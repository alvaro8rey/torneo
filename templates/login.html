<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Acceso Administrador</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .login-logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #3b82f6;
            color: #f8fafc;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn-login {
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            border: none;
            color: white;
            font-weight: bold;
            padding: 0.75rem;
            font-size: 1rem;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            color: white;
        }
        .text-muted-custom { color: #94a3b8 !important; }
        .alert-error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }
        .public-link {
            color: #60a5fa;
            text-decoration: none;
        }
        .public-link:hover {
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <div class="login-logo">⚽</div>
        <h2 class="fw-bold mb-1">Panel de Administración</h2>
        <p class="text-muted-custom mb-4">Introduce la contraseña para acceder</p>

        {% if error %}
        <div class="alert-error mb-3">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3 text-start">
                <label class="form-label text-muted-custom small">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" autofocus required>
            </div>
            <button type="submit" class="btn btn-login w-100">Entrar al panel</button>
        </form>

        <hr class="border-secondary mt-4">
        <p class="small text-muted-custom mb-0">
            ¿Eres aficionado? <a href="/" class="public-link">Ver el torneo en directo</a>
        </p>
    </div>
</body>
</html>
