<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Torneo Pro - Gestor</title>
    <style>
        body { background-color: #f1f5f9; }
        .torneo-item { transition: all 0.2s; }
        .torneo-item:hover { background-color: #f8fafc; }
        .btn-edit-inline { padding: 0.25rem 0.5rem; font-size: 0.875rem; }
        .edit-form { display: none; width: 100%; }
        .torneo-info.editing { display: none; }
        .edit-form.editing { display: flex; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-primary">⚽ Gestor de Torneos</h1>
            <p class="lead text-secondary">Crea y gestiona tus torneos en tiempo real.</p>
        </div>

        <!-- Formulario de Creación -->
        <div class="card shadow-sm mx-auto mb-5" style="max-width: 500px; border-radius: 15px;">
            <div class="card-body p-4">
                <form action="/crear_torneo" method="post">
                    <label class="form-label fw-bold">Nuevo Torneo</label>
                    <div class="input-group">
                        <input type="text" name="nombre" class="form-control" placeholder="Ej: Copa Carnaval" required>
                        <button class="btn btn-primary px-4">Crear</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista de Torneos -->
        <div class="mx-auto" style="max-width: 700px;">
            <h3 class="mb-4 text-dark fw-bold">Torneos Disponibles</h3>
            <div class="list-group shadow-sm">
                {% for torneo in torneos %}
                <div class="list-group-item torneo-item p-3">
                    <div class="d-flex align-items-center justify-content-between w-100">
                        
                        <!-- Vista Normal -->
                        <div id="info-{{ torneo.id }}" class="torneo-info d-flex align-items-center flex-grow-1">
                            <a href="/torneo/{{ torneo.id }}" class="text-decoration-none text-dark fw-bold fs-5 flex-grow-1">
                                {{ torneo.nombre }}
                            </a>
                            <div class="ms-3 d-flex gap-2">
                                <button onclick="toggleEdit('{{ torneo.id }}')" class="btn btn-outline-secondary btn-sm">
                                    ✎ Editar
                                </button>
                                <button onclick="confirmDelete('{{ torneo.id }}', '{{ torneo.nombre }}')" class="btn btn-outline-danger btn-sm">
                                    🗑️ Borrar
                                </button>
                                <a href="/torneo/{{ torneo.id }}" class="btn btn-primary btn-sm px-3">Entrar →</a>
                            </div>
                        </div>

                        <!-- Formulario de Edición (Oculto por defecto) -->
                        <form id="edit-form-{{ torneo.id }}" action="/editar_torneo/{{ torneo.id }}" method="post" class="edit-form gap-2">
                            <input type="text" name="nombre" class="form-control" value="{{ torneo.nombre }}" required>
                            <button type="submit" class="btn btn-success btn-sm">Guardar</button>
                            <button type="button" onclick="toggleEdit('{{ torneo.id }}')" class="btn btn-light btn-sm border">Cancelar</button>
                        </form>

                    </div>
                </div>
                {% else %}
                <div class="list-group-item text-center py-5 text-muted">
                    No hay torneos creados todavía. ¡Crea el primero arriba!
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación de Borrado (Opcional, usando confirm por simplicidad) -->
    <script>
        function toggleEdit(id) {
            const infoDiv = document.getElementById(`info-${id}`);
            const editForm = document.getElementById(`edit-form-${id}`);
            
            if (infoDiv.style.display === 'none') {
                infoDiv.classList.remove('d-none'); // Fallback para clases de bootstrap
                infoDiv.style.display = 'flex';
                editForm.style.display = 'none';
            } else {
                infoDiv.style.display = 'none';
                editForm.style.display = 'flex';
                editForm.querySelector('input').focus();
            }
        }

        function confirmDelete(id, nombre) {
            if (confirm(`¿Estás seguro de que quieres eliminar el torneo "${nombre}"?\nEsta acción borrará todos los grupos, partidos y resultados permanentemente.`)) {
                window.location.href = `/eliminar_torneo/${id}`;
            }
        }
    </script>
</body>
</html>
