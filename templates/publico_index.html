<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Torneos en Directo</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; }
        .card { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 12px; }
        .text-muted-custom { color: #94a3b8 !important; }
        .torneo-btn {
            background: linear-gradient(45deg, #1e3a5f, #1e293b);
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 10px;
            padding: 1.5rem;
            text-decoration: none;
            display: block;
            transition: all 0.2s;
        }
        .torneo-btn:hover {
            background: linear-gradient(45deg, #1d4ed8, #1e3a5f);
            border-color: #3b82f6;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <div style="font-size: 3rem;">⚽</div>
            <h1 class="display-5 fw-bold text-primary">Torneos en Directo</h1>
            <p class="text-muted-custom">Selecciona un torneo para ver la información en tiempo real</p>
        </div>
        <div class="row justify-content-center g-3">
            {% for torneo in torneos %}
            <div class="col-md-4">
                <a href="/publico/{{ torneo.id }}" class="torneo-btn">
                    <h4 class="fw-bold mb-1">{{ torneo.nombre }}</h4>
                    <small class="text-muted-custom">Ver clasificaciones y resultados →</small>
                </a>
            </div>
            {% else %}
            <div class="col-12 text-center py-5 text-muted-custom">
                No hay torneos activos en este momento.
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
